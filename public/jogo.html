<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quiz Pac-Man - IF Sudeste MG</title>
    <link rel="stylesheet" href="estilo.css">
    <style>
        /* ── D-pad touch ─────────────────────────────────────────────────── */
        #dpad {
            position: absolute;
            bottom: 14px;
            right: 14px;
            width: clamp(108px, 24vw, 152px);
            height: clamp(108px, 24vw, 152px);
            display: none;          /* visível só em touch */
            z-index: 20;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 3px;
        }

        .dpad-btn {
            width: 100%;
            height: 100%;
            background: rgba(47, 158, 65, 0.55);
            border: 2px solid rgba(47, 158, 65, 0.85);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(15px, 2.8vw, 19px);
            color: #fff;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: background 0.08s;
            -webkit-tap-highlight-color: transparent;
        }

        .dpad-btn:active,
        .dpad-btn.pressionado {
            background: rgba(47, 158, 65, 0.9);
        }

        /* Posições: cima centro, baixo centro, esq meio, dir meio */
        #dpad-up    { grid-column: 2; grid-row: 1; }
        #dpad-down  { grid-column: 2; grid-row: 3; }
        #dpad-left  { grid-column: 1; grid-row: 2; }
        #dpad-right { grid-column: 3; grid-row: 2; }

        /* Centro decorativo */
        #dpad-center {
            grid-column: 2;
            grid-row: 2;
            background: rgba(0, 0, 16, 0.5);
            border-radius: 6px;
        }
    </style>
</head>
<body class="jogo-pagina">

    <main class="jogo-wrapper">
        <div class="jogo-container">

            <div id="painel" class="painel-questao">
                <div class="painel-pergunta-wrap">
                    <span class="painel-label">QUESTÃO</span>
                    <p id="pergunta">Preparando a primeira pergunta...</p>
                </div>
                <div class="painel-hud">
                    <div class="hud-item">
                        <span class="hud-label">PONTOS</span>
                        <span id="pontos" class="hud-valor">0</span>
                    </div>
                    <div class="hud-divider"></div>
                    <div class="hud-item">
                        <span class="hud-label">VIDAS</span>
                        <span id="vidas" class="hud-valor hud-vidas">❤ × 3</span>
                    </div>
                    <div class="hud-divider"></div>
                    <div class="hud-item">
                        <span class="hud-label">NÍVEL</span>
                        <span id="indicador-velocidade" class="hud-velocidade">⚡ Fácil</span>
                    </div>
                    <div class="hud-item" id="hud-combo" style="display:none">
                        <span id="indicador-combo" class="hud-combo"></span>
                    </div>
                </div>
            </div>

            <!-- Canvas com botões flutuantes sobrepostos -->
            <div id="canvas-wrapper">
                <canvas id="telaJogo" width="760" height="600"></canvas>
                <button id="btn-feedback-canvas" type="button" class="feedback-canvas-btn" style="display:none">OK</button>

                <!-- Timer flutuante -->
                <div id="timer-competicao" class="flutuante flutuante-timer" style="display:none">
                    <span id="timer-texto">⏱ 00:00</span>
                </div>

                <!-- Botão Sair flutuante -->
                <a href="index.html" id="btn-sair-flutuante" class="flutuante flutuante-sair">
                    ✕ Sair
                </a>

                <a href="aluno-conta.html" id="btn-conta-flutuante" class="flutuante flutuante-conta" style="display:none" title="Minha conta">
                    <span id="conta-avatar-texto" class="atalho-conta-icone">👤</span>
                </a>

                <!-- Nome do aluno flutuante -->
                <div id="nome-flutuante" class="flutuante flutuante-nome" style="display:none"></div>

                <!-- D-pad touch (visível apenas em dispositivos touch) -->
                <div id="dpad" aria-label="Controle direcional">
                    <button class="dpad-btn" id="dpad-up"    aria-label="Cima">▲</button>
                    <button class="dpad-btn" id="dpad-down"  aria-label="Baixo">▼</button>
                    <button class="dpad-btn" id="dpad-left"  aria-label="Esquerda">◀</button>
                    <button class="dpad-btn" id="dpad-right" aria-label="Direita">▶</button>
                    <div id="dpad-center"></div>
                </div>
            </div>

        </div>
    </main>

    <script>
        // Configuração central de layout compartilhada entre os módulos do jogo.
        window.CONFIG_LAYOUT_JOGO = Object.freeze({
            canvas: {
                margemLateral: 32,
                reservaAltura: 48,
                escalaMinima: 0.42
            },
            mapa: {
                tamanhoBlocoBase: 40,
                larguraSala: 3,
                alturaSala: 2
            },
            overlay: {
                espera: {
                    cardMaxLargura: 440,
                    cardAltura: 120,
                    botaoInicio: {
                        larguraProporcaoCard: 0.62,
                        altura: 40,
                        afastamentoBase: 18,
                        raio: 8
                    }
                }
            }
        });
    </script>

    <script src="questoes-storage.js"></script>
    <script src="mapa.js"></script>
    <script src="quiz.js"></script>
    <script src="entidades.js"></script>
    <script src="motor.js"></script>
    <script src="competicao.js"></script>
    <script>
        // Garante que o aluno sempre tenha nome antes de jogar
        if (!sessionStorage.getItem("aluno_nome")) {
            window.location.replace("sala-espera.html");
        }

        // Competição exige aluno logado
        const modoAtual = sessionStorage.getItem("modo") || "livre";
        if (modoAtual === "competicao" && (!sessionStorage.getItem("aluno_id") || sessionStorage.getItem("aluno_logado") !== "true")) {
            window.location.replace("aluno-login.html");
        }

        // Exibe nome do aluno flutuante
        const nomeAluno = sessionStorage.getItem("aluno_nome");
        if (nomeAluno) {
            const elNome = document.getElementById("nome-flutuante");
            elNome.innerText = nomeAluno;
            elNome.style.display = "block";
        }

        if (sessionStorage.getItem("aluno_logado") === "true" && sessionStorage.getItem("aluno_id")) {
            const conta = document.getElementById("btn-conta-flutuante");
            if (conta) conta.style.display = "inline-flex";
            const inicial = (sessionStorage.getItem("aluno_apelido") || sessionStorage.getItem("aluno_nome") || "").trim().charAt(0).toUpperCase();
            const avatar = document.getElementById("conta-avatar-texto");
            if (avatar && inicial) avatar.innerText = inicial;
        }

        // ── D-pad touch ───────────────────────────────────────────────────────
        // Mostra o D-pad apenas se o dispositivo tem suporte a touch
        (function configurarDpad() {
            const dpad = document.getElementById("dpad");

            // Detecta touch real (não apenas hover em desktop)
            const temTouch = ("ontouchstart" in window) || (navigator.maxTouchPoints > 0);
            if (temTouch) dpad.style.display = "grid";

            // Mapeia cada botão para a tecla correspondente
            const mapeamento = {
                "dpad-up":    "ArrowUp",
                "dpad-down":  "ArrowDown",
                "dpad-left":  "ArrowLeft",
                "dpad-right": "ArrowRight"
            };

            Object.entries(mapeamento).forEach(([id, tecla]) => {
                const btn = document.getElementById(id);
                if (!btn) return;

                // Dispara movimento ao tocar (e mantém pressionado via touchmove dentro do botão)
                function disparar(e) {
                    e.preventDefault();
                    btn.classList.add("pressionado");
                    // Simula evento de teclado que o motor.js espera
                    registrarDirecao({ key: tecla, preventDefault: () => {} });
                }

                function soltar() {
                    btn.classList.remove("pressionado");
                }

                btn.addEventListener("touchstart",  disparar,  { passive: false });
                btn.addEventListener("touchend",     soltar,    { passive: true  });
                btn.addEventListener("touchcancel",  soltar,    { passive: true  });

                // Suporte a mouse (para testes em desktop)
                btn.addEventListener("mousedown",  disparar);
                btn.addEventListener("mouseup",    soltar);
                btn.addEventListener("mouseleave", soltar);
            });
        })();

        // ── Competição ────────────────────────────────────────────────────────
        (async function configurarCompeticao() {
            if ((sessionStorage.getItem("modo") || "livre") !== "competicao") return;

            try {
                const res   = await fetch("/api/estado");
                const dados = await res.json();

                if (dados.fase === "rodando") {
                    sessionStorage.setItem("categoria_competicao", dados.categoria || "Todas");
                    document.getElementById("timer-competicao").style.display = "flex";
                    atualizarTimerVisual(dados.restante);

                    iniciarPolling(function onEncerrar() {
                        pausarRodada();
                        encerrarJogoCompeticao();
                    });

                    iniciarEnvioPontuacao(
                        () => pontuacao,
                        () => vidas
                    );
                }
            } catch {
                // Servidor inacessível: modo livre
            }
        })();

        async function encerrarJogoCompeticao() {
            try {
                await fetch("/api/pontuacao-final", {
                    method:  "POST",
                    headers: { "Content-Type": "application/json" },
                    body:    JSON.stringify({
                        alunoId:   sessionStorage.getItem("aluno_id") || "",
                        nome:      sessionStorage.getItem("aluno_apelido") || sessionStorage.getItem("aluno_nome") || "Anônimo",
                        pontuacao: pontuacao,
                        vidas:     vidas
                    })
                });
            } catch { /* silencioso */ }

            setTimeout(() => {
                window.location.href = "resultado-aluno.html";
            }, 800);
        }
    </script>

    <script>
        // ── Responsividade do canvas ──────────────────────────────────────────
        function obterConfigLayoutCanvas() {
            const cfg = window.CONFIG_LAYOUT_JOGO || {};
            const canvas = cfg.canvas || {};

            return {
                margemLateral: Number(canvas.margemLateral) || 32,
                reservaAltura: Number(canvas.reservaAltura) || 48,
                escalaMinima: Number(canvas.escalaMinima) || 0.42
            };
        }

        function obterDimensoesCanvasBase() {
            const canvas = document.getElementById("telaJogo");
            return {
                largura: canvas?.width || 760,
                altura:  canvas?.height || 600
            };
        }

        function ajustarEscala() {
            const wrapper   = document.getElementById("canvas-wrapper");
            const container = document.querySelector(".jogo-container");
            const painel    = document.getElementById("painel");
            if (!wrapper || !container || !painel) return;

            const cfg = obterConfigLayoutCanvas();
            const base = obterDimensoesCanvasBase();

            wrapper.style.width  = `${base.largura}px`;
            wrapper.style.height = `${base.altura}px`;

            const largDisp = Math.min(
                window.innerWidth - cfg.margemLateral,
                container.clientWidth || window.innerWidth - cfg.margemLateral
            );

            const altDisp = Math.max(
                260,
                window.innerHeight - painel.getBoundingClientRect().height - cfg.reservaAltura
            );

            const escalaAlvo = Math.min(largDisp / base.largura, altDisp / base.altura, 1);
            const escala = Math.max(cfg.escalaMinima, escalaAlvo);

            wrapper.style.transform       = `scale(${escala})`;
            wrapper.style.transformOrigin = "top center";

            const alturaReal    = base.altura * escala;
            const alturaOcupada = base.altura;
            wrapper.style.marginBottom = `${alturaReal - alturaOcupada}px`;

            const larguraEscalada = base.largura * escala;
            painel.style.maxWidth = larguraEscalada + "px";
        }

        // Utilitários de teste manual para validar responsividade em mapas futuros.
        function aplicarPresetLayoutMapa(preset) {
            const canvas = document.getElementById("telaJogo");
            if (!canvas) return;

            const bloco = Number(window.CONFIG_LAYOUT_JOGO?.mapa?.tamanhoBlocoBase) || 40;
            const presets = {
                pequeno: { colunas: 19, linhas: 15 },
                medio:   { colunas: 24, linhas: 18 },
                grande:  { colunas: 30, linhas: 22 }
            };

            const alvo = presets[preset];
            if (!alvo) return;

            canvas.width = alvo.colunas * bloco;
            canvas.height = alvo.linhas * bloco;

            if (typeof ajustarEscala === "function") ajustarEscala();
            if (typeof atualizarTela === "function") atualizarTela();
            if (typeof desenharTelaEspera === "function") desenharTelaEspera();
        }

        function restaurarLayoutMapaAtual() {
            if (typeof ajustarDimensoesCanvasPorMapa === "function") {
                ajustarDimensoesCanvasPorMapa();
            } else if (typeof ajustarEscala === "function") {
                ajustarEscala();
            }

            if (typeof atualizarTela === "function") atualizarTela();
            if (typeof desenharTelaEspera === "function") desenharTelaEspera();
        }

        window.aplicarPresetLayoutMapa = aplicarPresetLayoutMapa;
        window.restaurarLayoutMapaAtual = restaurarLayoutMapaAtual;

        window.addEventListener("load",   ajustarEscala);
        window.addEventListener("resize", ajustarEscala);
    </script>

</body>
</html>
