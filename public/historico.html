<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Histórico de Competições - IF Sudeste MG</title>
    <link rel="stylesheet" href="estilo.css">
    <style>body { display:none; }</style>
    <script>
        if (sessionStorage.getItem("professor_autenticado") !== "true") {
            window.location.replace("login.html");
        }

        async function validarSessaoProfessorHistorico() {
            try {
                const res = await fetch("/api/admin/sessao");
                if (!res.ok) throw new Error();
                document.body.style.display = "block";
            } catch {
                sessionStorage.removeItem("professor_autenticado");
                window.location.replace("login.html");
            }
        }

        document.addEventListener("DOMContentLoaded", validarSessaoProfessorHistorico);
    </script>
</head>
<body>

    <nav class="barra-topo">
        <img src="logo_if.png" alt="Logo IF Sudeste MG" class="logo-nav">
        <span class="nav-titulo">Histórico de Competições</span>
        <div class="nav-acoes">
            <a href="painel-competicao.html" class="btn-nav-outline">Competição 🏆</a>
            <a href="painel-professor.html"  class="btn-nav-outline">Questões</a>
            <a href="index.html" class="btn-nav-sair" onclick="sairProfessor(event)">Sair</a>
        </div>
    </nav>

    <main class="painel-wrapper">

        <div class="painel-cabecalho">
            <div>
                <h2>Histórico de Competições</h2>
                <p class="texto-secundario">Resultado de todas as competições realizadas neste servidor.</p>
            </div>
        </div>

        <!-- Lista de competições -->
        <div id="lista-historico"></div>

        <!-- Detalhe de uma competição (painel lateral) -->
        <div id="painel-detalhe" style="display:none">
            <div class="detalhe-header">
                <div>
                    <h3 id="detalhe-titulo"></h3>
                    <p class="texto-secundario" id="detalhe-info"></p>
                </div>
                <div style="display:flex; gap:8px; flex-wrap:wrap;">
                    <button onclick="exportarCSV()" class="btn-outline-sm">⬇ Exportar CSV</button>
                    <button onclick="fecharDetalhe()" class="btn-perigo-sm">✕ Fechar</button>
                </div>
            </div>

            <!-- Pódios da competição -->
            <div id="detalhe-podio" class="historico-podios"></div>

            <!-- Rodadas da competição -->
            <div id="detalhe-rodadas" style="margin-top: 16px;"></div>

            <!-- Relatório final -->
            <div id="detalhe-relatorio" style="margin-top: 16px;"></div>
        </div>

    </main>

    <script>
        let competicaoAtual = null; // dados completos da competição em detalhe

        const MEDALHAS  = ["🥇","🥈","🥉"];
        const COR_BORDA = ["#F1C40F","#95A5A6","#CD6133"];
        const COR_FUNDO = ["#FFFDE7","#F8F9FA","#FDF3EC"];

        async function sairProfessor(event) {
            if (event) event.preventDefault();
            try {
                await fetch("/api/logout", { method: "POST" });
            } catch {
                // segue para limpar sessão local
            }
            sessionStorage.removeItem("professor_autenticado");
            window.location.href = "index.html";
        }

        // ── Listagem ──────────────────────────────────────────────────────────────

        async function carregarHistorico() {
            const lista = document.getElementById("lista-historico");
            lista.innerHTML = `<div class="estado-vazio"><p>Carregando...</p></div>`;

            try {
                const res    = await fetch("/api/historico");
                const dados  = await res.json();

                if (dados.length === 0) {
                    lista.innerHTML = `
                        <div class="estado-vazio">
                            <p>Nenhuma competição registrada ainda.</p>
                            <p class="texto-secundario" style="margin-top:8px; font-size:.85rem">
                                As competições são salvas automaticamente ao encerrar.
                            </p>
                        </div>`;
                    return;
                }

                lista.innerHTML = dados.map(comp => `
                    <div class="questao-card hist-card" onclick="abrirDetalhe(${comp.id})">
                        <div class="questao-card-header">
                            <div style="display:flex; align-items:center; gap:10px;">
                                <span class="questao-numero">🏆</span>
                                <div>
                                    <strong>${comp.data} às ${comp.hora}</strong>
                                    <span class="hist-badge ${comp.motivo === 'tempo' ? '' : 'hist-badge-manual'}">
                                        ${comp.motivo === "tempo" ? "⏱ Tempo esgotado" : "■ Encerrada manualmente"}
                                    </span>
                                </div>
                            </div>
                            <button onclick="event.stopPropagation(); confirmarExclusao(${comp.id})"
                                class="btn-perigo-sm">Excluir</button>
                        </div>

                        <div class="hist-meta">
                            <span>👥 ${comp.participantes} participante${comp.participantes !== 1 ? "s" : ""}</span>
                            <span>⏱ ${Math.round(comp.duracaoSeg / 60)} min</span>
                            <span>🔁 ${comp.totalRodadas || 1} rodada${(comp.totalRodadas || 1) !== 1 ? "s" : ""}</span>
                        </div>

                        <div class="alts-wrap" style="margin-top:10px;">
                            ${comp.top3.map((a, i) => `
                                <span class="alt-badge ${i === 0 ? "alt-correta" : ""}">
                                    ${MEDALHAS[i]} ${a.nome} — ${a.pontuacao} pts
                                </span>`).join("")}
                        </div>

                        <p class="hint" style="margin-top:10px; font-size:.8rem">
                            Clique para ver o ranking completo →
                        </p>
                    </div>`).join("");

            } catch {
                lista.innerHTML = `<div class="estado-vazio"><p>Erro ao carregar histórico. Verifique o servidor.</p></div>`;
            }
        }

        // ── Detalhe ───────────────────────────────────────────────────────────────

        async function abrirDetalhe(id) {
            try {
                const res  = await fetch(`/api/historico/${id}`);
                competicaoAtual = await res.json();
                renderizarDetalhe(competicaoAtual);
                document.getElementById("painel-detalhe").style.display = "block";
                document.getElementById("painel-detalhe").scrollIntoView({ behavior: "smooth" });
            } catch {
                alert("Erro ao carregar detalhes desta competição.");
            }
        }

        function fecharDetalhe() {
            document.getElementById("painel-detalhe").style.display = "none";
            competicaoAtual = null;
        }

        function renderizarDetalhe(comp) {
            const totalRodadas = comp.totalRodadas || (Array.isArray(comp.rodadas) ? comp.rodadas.length : 1);
            document.getElementById("detalhe-titulo").innerText =
                `${comp.data} às ${comp.hora}`;
            document.getElementById("detalhe-info").innerText =
                `${comp.participantes} participante${comp.participantes !== 1 ? "s" : ""} · ${Math.round(comp.duracaoSeg / 60)} min por rodada · ${totalRodadas} rodada${totalRodadas !== 1 ? "s" : ""} · ${comp.motivo === "tempo" ? "Tempo esgotado" : "Encerrada manualmente"}`;

            renderizarPodiosCompeticao(comp);
            renderizarRodadasDetalhe(comp.rodadas || []);
            renderizarRelatorioFinalDetalhe(comp.relatorioFinal || null);
        }

        function renderizarPodiosCompeticao(comp) {
            const podio = document.getElementById("detalhe-podio");
            const rankingsCalculados = calcularRankingsCompeticao(comp);
            const relatorio = comp.relatorioFinal || {};
            const pontuacoesUnicas = Array.isArray(relatorio.topPontuacoesUnicas) && relatorio.topPontuacoesUnicas.length > 0
                ? relatorio.topPontuacoesUnicas
                : rankingsCalculados.pontuacoesUnicas;
            const pontuacoesMedias = Array.isArray(relatorio.topPontuacoesMedias) && relatorio.topPontuacoesMedias.length > 0
                ? relatorio.topPontuacoesMedias
                : rankingsCalculados.pontuacoesMedias;

            podio.innerHTML = `
                <section class="historico-podio">
                    <h3 class="historico-podio-titulo">Pontuações únicas</h3>
                    <p class="historico-podio-subtitulo">Melhor pontuação de cada participante</p>
                    <div class="podio-wrap">
                        ${renderizarLugaresPodio(pontuacoesUnicas, "unica")}
                    </div>
                </section>
                <section class="historico-podio">
                    <h3 class="historico-podio-titulo">Pontuações médias</h3>
                    <p class="historico-podio-subtitulo">Média nas rodadas participadas</p>
                    <div class="podio-wrap">
                        ${renderizarLugaresPodio(pontuacoesMedias, "media")}
                    </div>
                </section>`;
        }

        function calcularRankingsCompeticao(comp) {
            const rodadas = Array.isArray(comp.rodadas) && comp.rodadas.length > 0
                ? comp.rodadas
                : [{ numero: 1, ranking: Array.isArray(comp.ranking) ? comp.ranking : [] }];
            const porAluno = new Map();

            rodadas.forEach((rodada, index) => {
                const numeroRodada = rodada.numero || index + 1;
                (Array.isArray(rodada.ranking) ? rodada.ranking : []).forEach((aluno) => {
                    const id = aluno.alunoId || aluno.nome;
                    const pontuacao = Number(aluno.pontuacao) || 0;
                    const atual = porAluno.get(id) || {
                        alunoId: id,
                        nome: aluno.nome,
                        pontuacao,
                        rodada: numeroRodada,
                        soma: 0,
                        rodadasParticipadas: 0
                    };

                    if (pontuacao > atual.pontuacao || atual.rodadasParticipadas === 0) {
                        atual.pontuacao = pontuacao;
                        atual.rodada = numeroRodada;
                    }
                    atual.nome = aluno.nome || atual.nome;
                    atual.soma += pontuacao;
                    atual.rodadasParticipadas++;
                    porAluno.set(id, atual);
                });
            });

            const alunos = Array.from(porAluno.values());
            return {
                pontuacoesUnicas: alunos
                    .map(({ alunoId, nome, pontuacao, rodada }) => ({ alunoId, nome, pontuacao, rodada }))
                    .sort((a, b) => b.pontuacao - a.pontuacao || a.rodada - b.rodada)
                    .slice(0, 3),
                pontuacoesMedias: alunos
                    .map(({ alunoId, nome, soma, rodadasParticipadas }) => ({
                        alunoId,
                        nome,
                        media: Number((soma / rodadasParticipadas).toFixed(2)),
                        rodadasParticipadas
                    }))
                    .sort((a, b) => b.media - a.media || b.rodadasParticipadas - a.rodadasParticipadas)
                    .slice(0, 3)
            };
        }

        function renderizarLugaresPodio(ranking, tipo) {
            const top3 = ranking.slice(0, 3);
            while (top3.length < 3) top3.push(null);

            const config = [
                { pos: "2º", medalha: "🥈", cor: "#95A5A6", alt: "prata"  },
                { pos: "1º", medalha: "🥇", cor: "#F1C40F", alt: "ouro"   },
                { pos: "3º", medalha: "🥉", cor: "#CD6133", alt: "bronze" }
            ];
            const ordemVisual = [top3[1], top3[0], top3[2]];

            return ordemVisual.map((aluno, i) => {
                const cfg = config[i];
                if (!aluno) return `<div class="podio-lugar podio-${cfg.alt} vazio"></div>`;
                const pontuacao = tipo === "media"
                    ? `Média ${aluno.media} pts`
                    : `${aluno.pontuacao} pts`;
                const detalhe = tipo === "media"
                    ? `${aluno.rodadasParticipadas} rodada${aluno.rodadasParticipadas !== 1 ? "s" : ""}`
                    : `Rodada ${aluno.rodada}`;
                return `
                <div class="podio-lugar podio-${cfg.alt}">
                    <div class="podio-medalha">${cfg.medalha}</div>
                    <div class="podio-nome">${aluno.nome}</div>
                    <div class="podio-pts">${pontuacao}</div>
                    <div class="historico-podio-detalhe">${detalhe}</div>
                    <div class="podio-base" style="background:${cfg.cor}">${cfg.pos}</div>
                </div>`;
            }).join("");
        }

        function renderizarRodadasDetalhe(rodadas) {
            const el = document.getElementById("detalhe-rodadas");
            if (!Array.isArray(rodadas) || rodadas.length === 0) {
                el.innerHTML = "";
                return;
            }

            el.innerHTML = `
                <h3 style="margin-bottom:12px; color:var(--if-verde-escuro)">Rodadas</h3>
                ${rodadas.map((rodada, index) => {
                    const numero = rodada.numero || index + 1;
                    const ranking = Array.isArray(rodada.ranking) ? rodada.ranking : [];
                    const top3 = ranking.slice(0, 3);
                    return `
                    <div class="questao-card" style="margin-bottom:10px;">
                        <div style="display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:6px;">
                            <strong>Rodada ${numero}</strong>
                            <span class="hist-badge ${rodada.motivo === "tempo" ? "" : "hist-badge-manual"}">
                                ${rodada.motivo === "tempo" ? "⏱ Tempo esgotado" : "■ Encerrada manualmente"}
                            </span>
                        </div>
                        <div class="alts-wrap">
                            ${top3.length === 0
                                ? '<span class="hint">Sem pontuações registradas nesta rodada.</span>'
                                : top3.map((a, i) => `<span class="alt-badge ${i === 0 ? "alt-correta" : ""}">${MEDALHAS[i]} ${a.nome} — ${a.pontuacao} pts</span>`).join("")}
                        </div>
                        <button id="btn-ranking-rodada-${numero}" type="button" class="btn-outline-sm"
                            style="margin-top:10px" aria-expanded="false"
                            aria-controls="ranking-rodada-${numero}"
                            onclick="toggleRankingRodada(${numero})">Ranking Completo</button>
                        <div id="ranking-rodada-${numero}" style="display:none; margin-top:10px;">
                            ${renderizarLinhasRanking(ranking)}
                        </div>
                    </div>`;
                }).join("")}
            `;
        }

        function renderizarLinhasRanking(ranking) {
            if (ranking.length === 0) {
                return '<span class="hint">Sem pontuações registradas nesta rodada.</span>';
            }

            return ranking.map((aluno, i) => {
                const pos = i + 1;
                const empate = i > 0 && aluno.pontuacao === ranking[i - 1].pontuacao;
                const label = pos <= 3 ? MEDALHAS[pos - 1] : pos + "º";
                return `
                    <div class="questao-card placar-linha ${pos <= 3 ? "placar-destaque-" + pos : ""}"
                         style="margin-bottom:6px;">
                        <div class="placar-posicao">
                            ${empate ? '<span style="color:#aaa;font-size:.75rem">=</span>' : label}
                        </div>
                        <div class="placar-nome">${aluno.nome}</div>
                        <div class="placar-pontos">${aluno.pontuacao} pts</div>
                        <div class="placar-vidas">❤ × ${Math.max(0, Number(aluno.vidas) || 0)}</div>
                    </div>`;
            }).join("");
        }

        function toggleRankingRodada(numero) {
            const ranking = document.getElementById(`ranking-rodada-${numero}`);
            const botao = document.getElementById(`btn-ranking-rodada-${numero}`);
            const expandido = ranking.style.display === "none";
            ranking.style.display = expandido ? "block" : "none";
            botao.setAttribute("aria-expanded", String(expandido));
            botao.innerText = expandido ? "Ocultar Ranking" : "Ranking Completo";
        }

        function renderizarRelatorioFinalDetalhe(relatorio) {
            const el = document.getElementById("detalhe-relatorio");
            if (!relatorio) {
                el.innerHTML = "";
                return;
            }

            const unicas = relatorio.topPontuacoesUnicas || [];
            const medias = relatorio.topPontuacoesMedias || [];

            el.innerHTML = `
                <h3 style="margin-bottom:12px; color:var(--if-verde-escuro)">Relatório Final</h3>
                <div class="questao-card" style="margin-bottom:10px;">
                    <strong>Top 3 pontuações únicas</strong>
                    <div style="margin-top:8px; display:flex; flex-direction:column; gap:4px;">
                        ${unicas.length === 0
                            ? '<span class="hint">Sem dados.</span>'
                            : unicas.map((item, i) => `<span>${i + 1}º ${item.nome}: ${item.pontuacao} pts (Rodada ${item.rodada})</span>`).join("")}
                    </div>
                </div>
                <div class="questao-card">
                    <strong>Top 3 pontuações médias</strong>
                    <div style="margin-top:8px; display:flex; flex-direction:column; gap:4px;">
                        ${medias.length === 0
                            ? '<span class="hint">Sem dados.</span>'
                            : medias.map((item, i) => `<span>${i + 1}º ${item.nome}: média ${item.media} pts (${item.rodadasParticipadas} rodada(s))</span>`).join("")}
                    </div>
                </div>
            `;
        }

        // ── Exportação CSV ────────────────────────────────────────────────────────

        function exportarCSV() {
            if (!competicaoAtual) return;

            const comp   = competicaoAtual;
            const rodadas = Array.isArray(comp.rodadas) && comp.rodadas.length > 0
                ? comp.rodadas
                : [{ numero: 1, ranking: Array.isArray(comp.ranking) ? comp.ranking : [] }];
            const linhas = [["Rodada", "Posição", "Nome", "Pontuação", "Vidas"]];

            rodadas.forEach((rodada, index) => {
                const ranking = Array.isArray(rodada.ranking) ? rodada.ranking : [];
                ranking.forEach((aluno, posicao) => {
                    linhas.push([
                        rodada.numero || index + 1,
                        posicao + 1,
                        aluno.nome,
                        aluno.pontuacao,
                        aluno.vidas || 0
                    ]);
                });
            });

            const csv = linhas
                .map(l => l.map(v => `"${String(v).replace(/"/g,'""')}"`).join(","))
                .join("\n");

            const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
            const url  = URL.createObjectURL(blob);
            const a    = document.createElement("a");
            a.href     = url;
            a.download = `competicao_${comp.data.replace(/\//g,"-")}_${comp.hora.replace(/:/g,"h")}.csv`;
            a.click();
            URL.revokeObjectURL(url);
        }

        // ── Exclusão ──────────────────────────────────────────────────────────────

        async function confirmarExclusao(id) {
            if (!confirm("Excluir este registro do histórico? Esta ação não pode ser desfeita.")) return;
            try {
                await fetch(`/api/historico/${id}`, { method: "DELETE" });
                fecharDetalhe();
                carregarHistorico();
            } catch {
                alert("Erro ao excluir. Verifique o servidor.");
            }
        }

        // ── Inicialização ─────────────────────────────────────────────────────────
        carregarHistorico();
    </script>

    <style>
        .hist-card {
            cursor: pointer;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .hist-card:hover {
            border-color: var(--if-verde);
            box-shadow: 0 4px 16px rgba(47,158,65,0.15);
        }
        .hist-meta {
            display: flex;
            gap: 16px;
            font-size: 0.85rem;
            color: var(--cor-texto-claro);
            margin-top: 8px;
        }
        .hist-badge {
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 10px;
            background: var(--if-verde-claro);
            color: var(--if-verde-escuro);
            margin-left: 8px;
            font-weight: 600;
        }
        .hist-badge-manual {
            background: #FAEEDA;
            color: #633806;
        }
        .detalhe-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
            padding: 20px;
            background: var(--cor-fundo-card);
            border: var(--borda);
            border-left: 5px solid var(--if-verde);
            border-radius: var(--raio);
            box-shadow: var(--sombra);
            margin-bottom: 12px;
        }
        .historico-podios {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
            margin: 20px 0 8px;
        }
        .historico-podio {
            min-width: 0;
            padding: 18px 14px 12px;
            background: var(--cor-fundo-card);
            border: var(--borda);
            border-top: 3px solid var(--if-verde);
            border-radius: var(--raio);
            box-shadow: var(--sombra);
        }
        .historico-podio-titulo {
            margin: 0;
            color: var(--if-verde-escuro);
            text-align: center;
        }
        .historico-podio-subtitulo {
            margin: 5px 0 0;
            color: var(--cor-texto-claro);
            font-size: 0.88rem;
            text-align: center;
        }
        .historico-podio .podio-wrap {
            gap: 8px;
            min-height: 190px;
            padding-top: 16px;
        }
        .historico-podio .podio-lugar {
            flex: 1 1 0;
            min-width: 0;
            gap: 6px;
        }
        .historico-podio .podio-medalha {
            font-size: 2.2rem;
        }
        .historico-podio .podio-nome {
            max-width: 100%;
            overflow-wrap: anywhere;
            font-size: 0.9rem;
        }
        .historico-podio .podio-pts {
            text-align: center;
            font-size: 0.82rem;
        }
        .historico-podio-detalhe {
            color: var(--cor-texto-claro);
            font-size: 0.75rem;
            text-align: center;
        }
        @media (max-width: 900px) {
            .historico-podios {
                grid-template-columns: minmax(0, 1fr);
            }
        }
        @media (max-width: 480px) {
            .historico-podio {
                padding-right: 8px;
                padding-left: 8px;
            }
            .historico-podio .podio-wrap {
                gap: 4px;
            }
            .historico-podio .podio-medalha {
                font-size: 1.8rem;
            }
            .historico-podio .podio-nome {
                font-size: 0.8rem;
            }
        }
    </style>

</body>
</html>
